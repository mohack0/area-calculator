name: field_measure_pro
description: "Field Measure Pro - Real GPS and Freehand Boundary Measurement for Agricultural Fields, Farms, and Land Parcels on Android and Windows."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Map & GIS
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Geolocation & Permissions
  geolocator: ^10.1.0
  permission_handler: ^11.0.1

  # Local Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0 # Windows desktop SQLite support
  path_provider: ^2.1.1
  path: ^1.8.3

  # PDF & Reporting
  pdf: ^3.10.4
  printing: ^5.11.0

  # File handling & Sharing
  share_plus: ^7.2.1
  file_picker: ^6.1.1

  # State Management & Utilities
  provider: ^6.1.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
